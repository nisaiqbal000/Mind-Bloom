<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mind Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column app shell (sticky top bar, floating tab bar, full-screen game stage).
   Dark-first twilight garden with bright pastel game tiles; the light theme is a pale dawn version. */
:root{
  --bg:#14102b; --bg-2:#1b1638; --surface:#221c47; --surface-2:#2e2762;
  --line:rgba(255,255,255,.1); --bar:rgba(20,16,43,.92);
  --ink:#f4f0ff; --ink-dim:#aaa3d6;
  --bloom:#ff8fb1; --leaf:#5fe3b4; --sun:#ffd166; --sun-ink:#ffd166; --sky:#7cc4ff; --lav:#b9a5ff; --flame:#ff9a5c;
  --t-sky:#8fd0ff; --t-sun:#ffd166; --t-leaf:#6fe8bd; --t-bloom:#ff9db9; --t-lav:#c4b3ff; --on-tile:#1d1340;
  --btn-bg:#ff8fb1; --btn-fg:#33102a; --btn-edge:#c94f7c;
  --ok-bg:rgba(95,227,180,.16); --no-bg:rgba(255,143,177,.16);
  --soil:#54407a; --shadow:0 14px 40px rgba(0,0,0,.4);
  --glow-a:rgba(255,143,177,.13); --glow-b:rgba(95,227,180,.09);
  --font-display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5eb; --bg-2:#e8eddc; --surface:#fffef9; --surface-2:#e8f0df;
    --line:rgba(34,66,52,.14); --bar:rgba(243,245,235,.94);
    --ink:#20352c; --ink-dim:#5b7164;
    --bloom:#d64f61; --leaf:#25835e; --sun:#e6a82e; --sun-ink:#a66e0d; --sky:#347ea2; --lav:#7664a8; --flame:#e26c3b;
    --btn-bg:#d64f61; --btn-fg:#ffffff; --btn-edge:#a53246;
    --ok-bg:rgba(37,131,94,.13); --no-bg:rgba(214,79,97,.12);
    --soil:#a89278; --shadow:0 14px 40px rgba(32,53,44,.14);
    --glow-a:rgba(214,79,97,.09); --glow-b:rgba(37,131,94,.09);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f5eb; --bg-2:#e8eddc; --surface:#fffef9; --surface-2:#e8f0df;
  --line:rgba(34,66,52,.14); --bar:rgba(243,245,235,.94);
  --ink:#20352c; --ink-dim:#5b7164;
  --bloom:#d64f61; --leaf:#25835e; --sun:#e6a82e; --sun-ink:#a66e0d; --sky:#347ea2; --lav:#7664a8; --flame:#e26c3b;
  --btn-bg:#d64f61; --btn-fg:#ffffff; --btn-edge:#a53246;
  --ok-bg:rgba(37,131,94,.13); --no-bg:rgba(214,79,97,.12);
  --soil:#a89278; --shadow:0 14px 40px rgba(32,53,44,.14);
  --glow-a:rgba(214,79,97,.09); --glow-b:rgba(37,131,94,.09);
  color-scheme:light;
}
:root[data-theme="garden"]{
  --bg:#eaf2e5;--bg-2:#dcebd8;--surface:#fbfff7;--surface-2:#dcebd8;--line:rgba(27,80,54,.17);--bar:rgba(234,242,229,.94);
  --ink:#193d2b;--ink-dim:#557461;--bloom:#cb4c67;--leaf:#26794f;--sun:#d99a24;--sun-ink:#98600c;--sky:#397e9a;--lav:#697dba;--flame:#d96235;
  --btn-bg:#26794f;--btn-fg:#fff;--btn-edge:#185a3a;--ok-bg:rgba(38,121,79,.13);--no-bg:rgba(203,76,103,.12);--soil:#9b8060;--shadow:0 14px 40px rgba(25,61,43,.16);--glow-a:rgba(203,76,103,.1);--glow-b:rgba(38,121,79,.12);color-scheme:light;
}
:root[data-theme="sunrise"]{
  --bg:#fff3e6;--bg-2:#fce1cf;--surface:#fffaf4;--surface-2:#f7e0d3;--line:rgba(103,61,46,.15);--bar:rgba(255,243,230,.94);
  --ink:#4b3029;--ink-dim:#80645a;--bloom:#d55266;--leaf:#347b66;--sun:#e99a33;--sun-ink:#a45c18;--sky:#5688a0;--lav:#856895;--flame:#df6638;
  --btn-bg:#d55266;--btn-fg:#fff;--btn-edge:#a5364d;--ok-bg:rgba(52,123,102,.13);--no-bg:rgba(213,82,102,.12);--soil:#a48770;--shadow:0 14px 40px rgba(75,48,41,.15);--glow-a:rgba(233,154,51,.12);--glow-b:rgba(52,123,102,.09);color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 38% at 88% -4%,var(--glow-a),transparent 72%),radial-gradient(50% 34% at 0% 102%,var(--glow-b),transparent 72%)}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:600;line-height:1.15;text-wrap:balance}
p{margin:0;text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.dim{color:var(--ink-dim)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding-inline:16px;padding-bottom:128px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-inline:-16px;padding:12px 16px 10px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font:600 1.3rem var(--font-display);min-width:0}
.brand svg{width:32px;height:32px;flex:none}
.hud{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
  font:500 .95rem var(--font-display);font-variant-numeric:tabular-nums}
.lang-toggle{border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:48px;justify-content:center;padding-inline:10px}
.pill svg{width:18px;height:18px;color:var(--sun-ink)}
.pill.bump{animation:bump .4s ease}
.xp{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .5s ease}

.view{display:grid;gap:26px;padding-top:16px;animation:viewin .35s ease both}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:1.2rem}
.link{background:none;border:0;padding:4px 0;color:var(--ink-dim);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.hello{font-size:clamp(1.9rem,6.5vw,2.6rem)}
.hello-sub{color:var(--ink-dim);margin-top:8px;max-width:46ch}
.home-hero{position:relative;overflow:hidden;padding:22px 20px 24px;border:1px solid var(--line);border-radius:24px;
  background:linear-gradient(120deg,var(--surface) 0%,var(--surface-2) 72%,color-mix(in srgb,var(--t-leaf) 20%,var(--surface)) 100%);
  display:grid;grid-template-columns:minmax(0,1fr) 200px;align-items:center;gap:8px;min-height:256px}
.home-hero-copy{position:relative;z-index:2;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;color:var(--leaf);font-size:.75rem;font-weight:900;text-transform:uppercase}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--bloom);box-shadow:0 0 0 4px var(--no-bg)}
.home-hero .hello-sub{max-width:42ch}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:18px}
.buddy-scene{position:relative;display:grid;justify-items:center;align-content:center;min-height:210px}
.buddy-line{position:relative;z-index:2;max-width:188px;padding:8px 12px;border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--ink);font-size:.78rem;font-weight:800;line-height:1.25;text-align:center;box-shadow:0 4px 12px rgba(20,40,30,.08)}
.buddy-line::after{content:"";position:absolute;left:calc(50% - 6px);bottom:-6px;width:10px;height:10px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bloom-buddy{position:relative;z-index:1;width:190px;height:170px;margin-top:4px;padding:0;border:0;background:none;display:grid;place-items:center;animation:buddy-bob 3.8s ease-in-out infinite}
.bloom-buddy svg{width:100%;height:100%;overflow:visible}
.buddy-eye{transform-box:fill-box;transform-origin:center;animation:buddy-blink 5.4s ease-in-out infinite}
.buddy-arm{transform-box:fill-box;transform-origin:top center;animation:buddy-wave 3.2s ease-in-out infinite}
.buddy-scene.celebrate .bloom-buddy{animation:buddy-cheer .8s cubic-bezier(.2,1.5,.4,1) 2}
.buddy-butterfly{position:absolute;top:44%;right:2%;width:46px;height:42px;animation:butterfly-float 4.6s ease-in-out infinite}
.buddy-butterfly svg{width:100%;height:100%;overflow:visible}
.butterfly-wing{transform-box:fill-box;transform-origin:center;animation:wing-flutter .38s ease-in-out infinite alternate}
.butterfly-wing.right{animation-delay:.12s}
.buddy-leaf{position:absolute;width:16px;height:9px;border-radius:100% 0 100% 0;background:var(--leaf);opacity:.6;animation:leaf-drift 4.2s ease-in-out infinite}
.buddy-leaf.one{left:8%;top:48%;transform:rotate(-32deg)}
.buddy-leaf.two{right:10%;top:28%;background:var(--bloom);animation-delay:-1.6s;transform:rotate(22deg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;
  background:var(--btn-bg);color:var(--btn-fg);font:600 1rem var(--font-display);box-shadow:0 5px 0 var(--btn-edge);
  transition:transform .1s,box-shadow .1s;margin-bottom:5px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
.btn svg{width:20px;height:20px}
.btn.big{padding:16px 34px;font-size:1.15rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none;padding:10px 18px;margin-bottom:0}
.btn.ghost:active{transform:scale(.97)}
.btn.small{padding:8px 16px;font-size:.9rem;box-shadow:0 3px 0 var(--btn-edge);margin-bottom:3px}
.btn[disabled]{opacity:.45;box-shadow:none;transform:none;cursor:not-allowed}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.streak{display:grid;gap:16px}
.streak-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.flame{width:54px;height:54px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;color:var(--flame)}
.flame svg{width:30px;height:30px}
.flame.live svg{fill:currentColor}
.big-n{font:600 2rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.rest{margin-left:auto;display:grid;gap:4px;justify-items:end;font-size:.78rem;color:var(--ink-dim)}
.rest div{display:flex;gap:6px}
.rest i{width:14px;height:14px;border-radius:50%;border:2px solid var(--lav)}
.rest i.on{background:var(--lav)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;justify-items:center;gap:6px;font-size:.75rem;color:var(--ink-dim);font-weight:700}
.day i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--surface-2);display:block}
.day.on i{background:var(--leaf)}
.day.today i{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--lav)}

.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{border:0;border-radius:18px;background:var(--tc);color:var(--on-tile);padding:12px 4px 10px;display:grid;justify-items:center;gap:6px;
  font:700 .72rem var(--font-body);transition:transform .12s;animation:tile-enter .42s cubic-bezier(.2,.8,.2,1) both}
.mood:nth-child(2){animation-delay:.05s}.mood:nth-child(3){animation-delay:.1s}.mood:nth-child(4){animation-delay:.15s}.mood:nth-child(5){animation-delay:.2s}
.mood:active{transform:scale(.94)}
.mood .face{width:32px;height:32px}
.rec{border-radius:24px;background:var(--tc);color:var(--on-tile);padding:18px;display:grid;gap:14px}
.rec p{font-weight:700;font-size:1.05rem;line-height:1.35}
.rec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rec .link{color:var(--on-tile);opacity:.8}
.rec .btn{background:var(--on-tile);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}

.quests{display:grid;gap:10px}
.quest{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;animation:tile-enter .42s cubic-bezier(.2,.8,.2,1) both}
.quest-t{font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .4s}
.quest-s{font-size:.8rem;color:var(--ink-dim);margin-top:4px}
.done-mark{display:inline-flex;align-items:center;gap:4px;color:var(--leaf);font-weight:800;font-size:.9rem}
.done-mark svg{width:18px;height:18px}
.chest{display:flex;align-items:center;gap:14px}
.gift{width:56px;height:56px;border-radius:18px;background:var(--t-sun);color:var(--on-tile);display:grid;place-items:center;flex:none}
.gift svg{width:30px;height:30px}
.chest.ready .gift{animation:wiggle 1.4s ease-in-out infinite}
.chest-t{flex:1;min-width:0}
.chest-t b{display:block;font:600 1.05rem var(--font-display)}

.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gcard{position:relative;overflow:hidden;text-align:left;border:0;border-radius:26px;padding:20px;min-height:176px;background:var(--tc);color:var(--on-tile);
  display:grid;align-content:space-between;gap:16px;transition:transform .15s;animation:tile-enter .5s cubic-bezier(.2,.8,.2,1) both}
.gcard:nth-child(2){animation-delay:.06s}.gcard:nth-child(3){animation-delay:.12s}.gcard:nth-child(4){animation-delay:.18s}.gcard:nth-child(5){animation-delay:.24s}
.gcard:hover{transform:translateY(-3px)}
.gcard:active{transform:scale(.98)}
.gcard .ghost-ic{position:absolute;right:-14px;top:-14px;width:120px;height:120px;opacity:.16;transform:rotate(-12deg)}
.gcard .gic{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.gcard .gic svg{width:26px;height:26px}
.gcard h3{font-size:1.4rem;margin-bottom:4px}
.gcard p{font-size:.92rem;line-height:1.35;font-weight:600;opacity:.85;max-width:30ch}
.gmeta{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--on-tile);font-size:.75rem;font-weight:800;letter-spacing:.03em}
.intro .tag,.wmeta .tag{background:var(--tc);}

.garden-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plot{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:6px 6px 36px;aspect-ratio:1/1.12;display:grid;place-items:center;transition:transform .15s}
.plot:hover{transform:translateY(-2px)}
.plot:active{transform:scale(.97)}
.plot svg{width:100%;height:100%;overflow:visible}
.plot-tag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;padding:3px 10px;border-radius:99px;background:var(--surface-2);font-size:.72rem;font-weight:800;color:var(--ink-dim)}
.plot.bloom .plot-tag{background:var(--ok-bg);color:var(--leaf)}
.plot.pop svg{animation:grow .7s cubic-bezier(.2,1.6,.4,1)}
.sway{transform-origin:50px 86px;animation:sway 4.5s ease-in-out infinite}
.spcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.spc{display:grid;justify-items:center;gap:2px;font-size:.78rem;font-weight:700;text-align:center;padding:8px 4px;border-radius:18px;background:var(--surface)}
.spc svg{width:64px;height:64px}
.spc:not(.on) svg{filter:grayscale(1) brightness(.6);opacity:.35}
.spc:not(.on) span{color:var(--ink-dim)}

.profile{display:grid;gap:14px}
.profile-row{display:flex;align-items:center;gap:14px}
.profile-details{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(120px,.8fr);gap:10px;flex:1;min-width:0}
.profile-field{display:grid;gap:5px;color:var(--ink-dim);font-size:.78rem;font-weight:800}
.avatar{width:64px;height:64px;border-radius:22px;background:var(--t-leaf);color:var(--on-tile);display:grid;place-items:center;font:600 1.8rem var(--font-display);flex:none}
.field-in{width:100%;min-width:0;font:600 1.1rem var(--font-display);color:var(--ink);background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:10px 14px}
.field-in::placeholder{color:var(--ink-dim);opacity:.8}
.field-in.select{font:700 .95rem var(--font-body);padding:11px 10px}
.feedback-text{min-height:110px;resize:vertical;font:600 .95rem/1.5 var(--font-body)}
.feedback-box{display:grid;gap:14px}
.feedback-box form{display:grid;gap:10px}
.feedback-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.feedback-list{display:grid;gap:8px}
.feedback-entry{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.feedback-entry p{margin:4px 0;overflow-wrap:anywhere}
.field-in:focus{border-color:var(--lav);outline:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:2px}
.stat b{font:600 1.5rem var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink-dim);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;justify-items:center;gap:6px;font-size:.75rem;font-weight:700;color:var(--ink-dim)}
.wd i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:block}
.wd i.has{border:0;background:var(--tc)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);opacity:.55}
.ach.on{opacity:1}
.ach .ai{width:40px;height:40px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.ach .ai svg{width:20px;height:20px}
.ach.on .ai{background:var(--t-sun);color:var(--on-tile)}
.ach b{display:block;font:600 .95rem var(--font-display)}
.ach span{font-size:.78rem;color:var(--ink-dim);line-height:1.25;display:block}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:700;font-size:.88rem;color:var(--ink-dim)}
.seg button.on{background:var(--btn-bg);color:var(--btn-fg)}
.note{font-size:.82rem;color:var(--ink-dim)}

.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(100%,540px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bar);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:4px 0;font:700 .72rem var(--font-body);color:var(--ink-dim)}

/* game stage */
.stage{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

.intro{margin:auto 0;display:grid;justify-items:center;text-align:center;gap:16px}

  color:var(--on-tile);font:800 .72rem/1.15 var(--font-body);display:grid;place-items:center;text-align:center;padding:12px}

  box-shadow:0 0 90px rgba(185,165,255,.45);transition-property:transform,opacity;transition-timing-function:ease-in-out;transform:scale(.55);opacity:.6}
.orb-label{position:absolute;inset:0;display:grid;place-items:center;font:600 1.6rem var(--font-display);color:var(--on-tile);pointer-events:none;text-align:center;padding:0 24px}
.orb-count{text-align:center;color:var(--ink-dim);font-weight:700}

.result{margin:auto 0;display:grid;justify-items:center;text-align:center;gap:14px}
.result .big{font:600 4.2rem/1 var(--font-display);color:var(--tc);font-variant-numeric:tabular-nums;animation:score-pop .65s cubic-bezier(.2,1.4,.4,1) both}
.result .rl{font:600 1.1rem var(--font-display);color:var(--ink-dim)}
.result p{max-width:36ch}
.rows{display:grid;gap:8px;width:100%;max-width:360px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--surface);border-radius:14px;font-weight:700}
.row b{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.rbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(10,6,28,.62)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px 22px;max-width:420px;width:100%;box-shadow:var(--shadow);display:grid;gap:14px;justify-items:center;text-align:center;max-height:90vh;overflow:auto}
.sheet h2{font-size:1.7rem}
.sheet p{color:var(--ink-dim)}
.sheet .field-in{text-align:center}
.sheet .gift{width:84px;height:84px;border-radius:28px}
.sheet .gift svg{width:44px;height:44px}

#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:100;display:grid;justify-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{max-width:420px;padding:10px 18px;border-radius:99px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;font-size:.92rem;text-align:center;animation:toastin .3s ease both}
.toast.good{border-color:var(--leaf)}

.float{position:fixed;z-index:95;transform:translate(-50%,0);font:600 1.05rem var(--font-display);color:var(--sun-ink);pointer-events:none;animation:floatup .9s ease-out forwards}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

function translateTree(root){
  if(!root)return;
  const translateTextNode=node=>{
    if(node.parentElement&&node.parentElement.closest('style,script'))return;
    if(!englishText.has(node))englishText.set(node,node.nodeValue);
    const original=englishText.get(node);node.nodeValue=S.lang==='ur'?localizeText(original):original;
  };
  if(root.nodeType===Node.TEXT_NODE){translateTextNode(root);return;}
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let node;
  while((node=walker.nextNode()))translateTextNode(node);
  const elements=root.nodeType===Node.ELEMENT_NODE?[root,...root.querySelectorAll('*')]:root.querySelectorAll('*');
  elements.forEach(el=>['placeholder','title','aria-label'].forEach(attr=>{
    if(!el.hasAttribute(attr))return;
    let saved=englishAttrs.get(el);if(!saved){saved={};englishAttrs.set(el,saved);}if(saved[attr]===undefined)saved[attr]=el.getAttribute(attr);
    const original=saved[attr],value=S.lang==='ur'?localizeText(original):original;
    if(el.getAttribute(attr)!==value)el.setAttribute(attr,value);
  }));
}

function plantSVG(spId,st){
  const soil='<ellipse cx="50" cy="88" rx="30" ry="9" fill="var(--soil)"/><ellipse cx="50" cy="85.5" rx="22" ry="5" fill="var(--soil)" opacity=".6"/>';
  if(!st) return '<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="88" rx="30" ry="9" fill="var(--soil)" opacity=".5"/><path d="M50 50v22M39 61h22" stroke="var(--ink-dim)" stroke-width="4" stroke-linecap="round"/></svg>';
  const sp=SPECIES.find(s=>s.id===spId)||SPECIES[0],top=st===1?66:st===2?52:46,leaf='#46c995';
  let g='<path d="M50 86V'+top+'" stroke="'+leaf+'" stroke-width="4.5" stroke-linecap="round"/>';
  g+='<ellipse cx="40" cy="'+(top+13)+'" rx="10" ry="4.6" fill="'+leaf+'" transform="rotate(-28 40 '+(top+13)+')"/>';
  g+='<ellipse cx="60" cy="'+(top+22)+'" rx="10" ry="4.6" fill="'+leaf+'" transform="rotate(28 60 '+(top+22)+')"/>';
  if(st===2) g+='<ellipse cx="50" cy="'+(top-5)+'" rx="6.5" ry="9" fill="'+sp.c+'" stroke="rgba(30,20,60,.3)" stroke-width=".8"/>';
  if(st===3){
    const cy=top-6;
    for(let k=0;k<sp.n;k++)g+='<ellipse cx="50" cy="'+(cy-sp.ry*.85)+'" rx="'+sp.rx+'" ry="'+sp.ry+'" fill="'+sp.c+'" stroke="rgba(30,20,60,.28)" stroke-width=".8" transform="rotate('+(360/sp.n*k)+' 50 '+cy+')"/>';
    g+='<circle cx="50" cy="'+cy+'" r="6.5" fill="'+sp.d+'" stroke="rgba(30,20,60,.3)" stroke-width=".8"/>';
  }
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+soil+'<g class="sway">'+g+'</g></svg>';
}

/* ================= garden actions ================= */
function need(c){toast('You need '+c+' sun. A quick game earns plenty.');sfx.soft();}
function plotAction(i){
  const p=S.plots[i];
  if(!p){
    if(S.sun<COST[0]) return need(COST[0]);
    S.sun-=COST[0];
    const und=SPECIES.filter(s=>!S.disc[s.id]);
    S.plots[i]={sp:(und.length&&Math.random()<.7?pick(und):pick(SPECIES)).id,st:1};
    sfx.tap();toast('Seed planted');
  }else if(p.st<3){
    const c=COST[p.st];
    if(S.sun<c) return need(c);
    S.sun-=c;p.st++;quest('water');
    if(p.st===3){
      const sp=SPECIES.find(s=>s.id===p.sp);
      S.stats.blooms++;S.disc[p.sp]=true;lastBloom=i;
      sfx.bloom();confetti(90);toast(sp.name+' bloomed!','good');
      award(0,30);
    }else{sfx.good();toast('Growing nicely');}
  }else{
    toast(SPECIES.find(s=>s.id===p.sp).name+' is in full bloom.');return;
  }
  updateHud();save();checkAch();renderGarden();
}
function harvest(){
  const n=S.plots.filter(p=>p&&p.st===3).length;
  if(!n||S.harvest===dstr()) return;
  S.harvest=dstr();const gain=n*6;
  award(gain,5);sfx.good();toast('Harvest collected: +'+gain+' sun','good');renderGarden();
}
function claimQuest(i){
  ensureQuests();
  const q=S.quests.list[i];if(!q) return;
  const d=QUEST[q.id];
  if(q.claimed||q.p<d.goal) return;
  q.claimed=true;award(d.sun,15);sfx.good();toast('Quest done: +'+d.sun+' sun','good');
  if(S.quests.list.every(x=>x.claimed)&&S.quests.chest==='locked'){S.quests.chest='ready';toast('Bloom Box unlocked!','good');confetti(60);}
  save();renderHome();
}
function openChest(){
  if(S.quests.chest!=='ready') return;
  S.quests.chest='opened';
  const r=Math.random();let msg;
  if(r<.5){const n=40+rand(5)*10;award(n,10);msg=n+' sun for your garden.';}
  else if(r<.8){const n=80+rand(3)*20;award(n,20);msg='A big one: '+n+' sun and a burst of XP.';}
  else{
    const e=S.plots.findIndex(p=>!p);
    if(e>=0){S.plots[e]={sp:pick(SPECIES).id,st:1};award(0,20);msg='A free seed, already planted in your garden.';}
    else{award(100,20);msg='Your garden is full, so here are 100 sun instead.';}
  }
  save();sfx.win();confetti(120);renderHome();
  modal('<div class="gift">'+ICON.gift+'</div><h2>Bloom Box opened</h2><p>'+msg+'</p><button class="btn" data-act="modalClose">Lovely</button>');
}

/* ================= game stage ================= */
const stage=$('#stage'),sBody=$('#stageBody'),sTitle=$('#stageTitle'),sProg=$('#stageProg');
let active=null;
function setProg(p){sProg.style.width=Math.round(p*100)+'%';}
function stopActive(){
  if(!active) return;
  active.timers.forEach(t=>{clearTimeout(t);clearInterval(t);});
  active.off.forEach(f=>f());
  active=null;
}
function openStage(id,title){
  stopActive();
  active={id,timers:[],off:[]};
  sBody.onclick=null;sBody.innerHTML='';sTitle.textContent=title;setProg(0);
  stage.hidden=false;document.body.style.overflow='hidden';sBody.scrollTop=0;
}
function closeStage(){
  stopActive();stage.hidden=true;document.body.style.overflow='';sBody.innerHTML='';sBody.onclick=null;render();
}
function later(fn,ms){const id=setTimeout(fn,ms);if(active)active.timers.push(id);return id;}
function every(fn,ms){const id=setInterval(fn,ms);if(active)active.timers.push(id);return id;}
function listen(target,ev,fn){target.addEventListener(ev,fn);if(active)active.off.push(()=>target.removeEventListener(ev,fn));}

function introHTML(g,extra){
  const G=GAMES[g];

}

function quizIntro(){
  let cat='mixed';
  openStage('quiz','Brain Snacks');
  const chips=[['mixed','Mixed']].concat(Object.keys(CATS).map(k=>[k,CATS[k]]));
  sBody.innerHTML=introHTML('quiz','<div class="chips" role="group" aria-label="Topic">'+chips.map(c=>'<button class="chip'+(c[0]==='mixed'?' on':'')+'" data-cat="'+c[0]+'">'+c[1]+'</button>').join('')+'</div>');
  sBody.onclick=e=>{
    const c=e.target.closest('[data-cat]');
    if(c){cat=c.dataset.cat;$$('.chip',sBody).forEach(x=>x.classList.toggle('on',x.dataset.cat===cat));sfx.tap();return;}
    if(e.target.closest('[data-start]')){sfx.tap();quizPlay(cat);}
  };

function quizPlay(cat){
  openStage('quiz','Brain Snacks');
  const pool=QUESTIONS.map((q,i)=>Object.assign({id:i},q)).filter(q=>cat==='mixed'||q.c===cat);
  let fresh=pool.filter(q=>!S.seen.includes(q.id));
  if(fresh.length<6){S.seen=S.seen.filter(id=>!pool.some(p=>p.id===id));fresh=pool;}
  const qs=shuffle(fresh).slice(0,6);
  let i=0,right=0,combo=0,bestCombo=0,hints=1,locked=false,earned=0;
  function show(){
    const q=qs[i];locked=false;
    const opts=shuffle(q.o.map((t,k)=>({t,k})));
    setProg(i/qs.length);
    sBody.innerHTML='<div class="qmeta"><span class="tag">'+CATS[q.c]+'</span><span class="dim" style="font-weight:800">Question '+(i+1)+' of '+qs.length+'</span></div>'+
      '<div class="combo" id="combo">'+(combo>1?'Combo x'+combo+' · bonus sun':'')+'</div>'+
      '<h2 class="qtext">'+esc(q.q)+'</h2>'+
      '<div class="opts">'+opts.map(o=>'<button class="opt" data-k="'+o.k+'">'+esc(o.t)+'</button>').join('')+'</div>'+
      '<div id="fb"></div>'+
      '<div class="qfoot" id="qfoot"><button class="btn ghost" data-hint '+(hints?'':'disabled')+'>Hint ('+hints+' left)</button></div>';
    sBody.onclick=e=>{
      if(e.target.closest('[data-hint]')){
        if(!hints||locked) return;
        hints--;sfx.tap();
        shuffle($$('.opt',sBody).filter(b=>+b.dataset.k!==q.a)).slice(0,2).forEach(b=>b.classList.add('gone'));
        const hb=$('[data-hint]',sBody);hb.disabled=true;hb.textContent='Hint used';return;
      }
      if(e.target.closest('[data-next]')){sfx.tap();i++;if(i>=qs.length)finish();else show();return;}
      const o=e.target.closest('.opt');
      if(!o||locked) return;
      locked=true;
      const ok=+o.dataset.k===q.a;
      if(!S.seen.includes(q.id))S.seen.push(q.id);
      if(S.seen.length>200)S.seen=S.seen.slice(-120);
      $$('.opt',sBody).forEach(b=>{
        if(+b.dataset.k===q.a)b.classList.add('ok');
        else if(b===o)b.classList.add('no');
        else b.classList.add('dim');
      });
      if(ok){
        right++;combo++;bestCombo=Math.max(bestCombo,combo);S.stats.quizRight++;quest('right',1);
        const gain=4+Math.min(combo-1,3);earned+=gain;
        award(gain,5);sfx.good();floatText(o,'+'+gain+' sun');
      }else{combo=0;sfx.soft();}
      $('#combo',sBody).textContent=combo>1?'Combo x'+combo+' · bonus sun':'';
      $('#fb',sBody).innerHTML='<div class="fb"><p><b>'+(ok?pick(['Right!','Nice one.','Exactly.','You got it.']):pick(['Close one.','Good try.','Not this time.']))+'</b> '+esc(q.e)+'</p></div>';
      $('#qfoot',sBody).innerHTML='<span></span><button class="btn" data-next>'+(i===qs.length-1?'See results':'Next')+'</button>';
      $('[data-next]',sBody).scrollIntoView({block:'nearest'});
    };
  }
  function finish(){
    const bonus=8+right*2;
    S.stats.perfect+=right===qs.length?1:0;
    S.bests.quiz=Math.max(S.bests.quiz,right);
    quest('quiz',1);finishGame('quiz',{sun:bonus,xp:10});
    if(right>=5){confetti(110);sfx.win();}else if(right>=3)sfx.good();
    result({color:'var(--t-sky)',big:right+'/'+qs.length,label:'correct answers',
      msg:right===qs.length?'Flawless. That brain is on fire.':right>=4?'Strong round. That knowledge is banked.':right>=2?'Solid effort. Those explanations will stick.':'Rough round, good learning. Every miss is a memory in progress.',
      rows:[['Best combo','x'+Math.max(bestCombo,1)],['Sun earned',earned+bonus]],again:()=>quizPlay(cat)});
  }
  show();
}

/* ---- Concept Pairs ---- */
function memoryPlay(){
  openStage('memory','Concept Pairs');
  const pairs=shuffle(S.lang==='ur'?PAIRS_URDU:PAIRS).slice(0,6);
  const cards=shuffle(pairs.flatMap((p,k)=>[{k,t:p[0],kind:'term'},{k,t:p[1],kind:'def'}]));
  let first=null,lock=false,moves=0,matched=0,peeks=1;
  sBody.innerHTML='<div class="mstat"><span id="mstat"></span><button class="btn ghost" data-peek>Peek (1)</button></div><div class="mgrid">'+
    cards.map((c,i)=>'<button class="mcard '+c.kind+'" data-i="'+i+'" aria-label="Card '+(i+1)+'"><span class="mi"><span class="mf">'+ICON.memory+'</span><span class="mb">'+esc(c.t)+'</span></span></button>').join('')+'</div>'+
    '<p class="note" style="text-align:center">Match each term, shown in the bold font, with its meaning.</p>';
  const els=$$('.mcard',sBody);
  function status(){$('#mstat',sBody).textContent='Moves '+moves+' · Pairs '+matched+'/6';setProg(matched/6);}
  function flip(i,on){cards[i].up=on;els[i].classList.toggle('up',on);}
  sBody.onclick=e=>{
    const pk=e.target.closest('[data-peek]');
    if(pk){
      if(peeks<1||first!==null||lock) return;
      peeks--;lock=true;pk.textContent='Peek (0)';pk.disabled=true;
      els.forEach((el,i)=>{if(!cards[i].done)el.classList.add('up');});
      later(()=>{els.forEach((el,i)=>{if(!cards[i].done)el.classList.remove('up');});lock=false;},1500);
      return;
    }
    const b=e.target.closest('.mcard');if(!b||lock) return;
    const i=+b.dataset.i;if(cards[i].up||cards[i].done) return;
    flip(i,true);sfx.flip();
    if(first===null){first=i;return;}
    moves++;
    const a=cards[first],c=cards[i];
    if(a.k===c.k){
      a.done=c.done=true;els[first].classList.add('done');els[i].classList.add('done');
      matched++;first=null;sfx.good();status();
      if(matched===6)later(finish,800);
    }else{
      lock=true;const f=first;first=null;sfx.soft();status();
      later(()=>{flip(f,false);flip(i,false);lock=false;},900);
    }
  };
  function finish(){
    const sun=Math.max(14,40-Math.max(0,moves-6)*3);
    S.bests.memory=(!S.bests.memory||moves<S.bests.memory)?moves:S.bests.memory;
    quest('match',1);finishGame('memory',{sun,xp:15});
    confetti(80);sfx.win();
    result({color:'var(--t-sun)',big:String(moves),label:'moves to clear the board',
      msg:moves<=8?'Sharp memory. Hardly a wasted flip.':moves<=12?'Nicely done. Your focus is working.':'Cleared it. Patience wins this one.',
      rows:[['Pairs matched','6/6'],['Sun earned',sun]],again:memoryPlay});
  }
  status();
}

/* ---- Word Bloom ---- */
function wordPlay(){
  openStage('word','Word Bloom');
  const list=shuffle(S.lang==='ur'?WORDS_URDU:WORDS).slice(0,5);
  let wi=0,solved=0,earned=0,tiles=[],ans=[],hints=0,state='',msg='';
  function load(){
    const w=list[wi][0],letters=graphemes(w);let sh;
    do{sh=shuffle(letters);}while(sh.join('')===w);
    tiles=sh.map(ch=>({ch,used:false}));ans=[];hints=0;state='';msg='';draw();
  }
  function draw(){
    const w=list[wi][0],clue=list[wi][1];
    const slots=graphemes(w).map((_,k)=>ans[k]!==undefined?'<button class="slot filled'+(state==='ok'?' good':'')+'" data-slot="'+k+'">'+tiles[ans[k]].ch+'</button>':'<span class="slot"></span>').join('');
    sBody.innerHTML='<div class="wmeta" style="--tc:var(--t-leaf)"><span class="tag">Word '+(wi+1)+' of '+list.length+'</span><span class="dim" style="font-weight:800">'+solved+' solved</span></div>'+
      '<p class="clue">'+esc(clue)+'</p><div class="slots'+(state==='bad'?' shake':'')+'" id="slots">'+slots+'</div><p class="wmsg">'+esc(msg)+'</p>'+
      '<div class="tiles">'+tiles.map((t,i)=>'<button class="tile" data-tile="'+i+'" '+(t.used?'disabled':'')+'>'+t.ch+'</button>').join('')+'</div>'+
      '<div class="wbtns"><button class="btn ghost" data-hint '+(hints>=w.length-1||state==='ok'?'disabled':'')+'>Hint</button><button class="btn ghost" data-clear>Clear</button><button class="btn ghost" data-skip>Skip</button></div>';
    setProg(wi/list.length);
  }
  function addTile(i){
    const w=list[wi][0];
    if(state==='ok'||!tiles[i]||tiles[i].used||ans.length>=graphemes(w).length) return;
    tiles[i].used=true;ans.push(i);sfx.tap();state='';msg='';
    if(ans.length===w.length){
      const guess=ans.map(x=>tiles[x].ch).join('');
      if(guess===w){
        state='ok';msg=S.lang==='ur'?'درست! '+w+'.':'Yes! '+w.charAt(0)+w.slice(1).toLowerCase()+'.';
        const gain=hints?4:8;earned+=gain;solved++;S.stats.words++;quest('word',1);
        award(gain,hints?4:6);sfx.good();draw();floatText($('#slots',sBody),'+'+gain+' sun');
        later(next,1000);return;
      }
      state='bad';msg='Not quite. Tap a letter to swap it out.';sfx.soft();
    }
    draw();
  }
  function removeAt(k){
    if(state==='ok'||ans[k]===undefined) return;
    const idx=ans.splice(k,1)[0];tiles[idx].used=false;state='';msg='';draw();
  }
  function clearAll(){if(state==='ok') return;tiles.forEach(t=>t.used=false);ans=[];state='';msg='';draw();}
  function hint(){
    const w=list[wi][0];
    const letters=graphemes(w);
    if(state==='ok'||hints>=letters.length-1) return;
    hints++;tiles.forEach(t=>t.used=false);ans=[];
    for(let k=0;k<hints;k++){const j=tiles.findIndex(t=>!t.used&&t.ch===letters[k]);if(j>=0){tiles[j].used=true;ans.push(j);}}
    state='';msg=hints>1?'Hint: the first '+hints+' letters are placed.':'Hint: the first letter is placed.';sfx.tap();draw();
  }
  function next(){wi++;if(wi>=list.length)finish();else load();}
  function finish(){
    S.bests.word=Math.max(S.bests.word,solved);
    finishGame('word',{sun:5,xp:8});
    if(solved>=4){confetti(90);sfx.win();}
    result({color:'var(--t-leaf)',big:solved+'/'+list.length,label:'words solved',
      msg:solved>=4?'A real wordsmith. Your vocabulary is blooming.':solved>=2?'Good work. A few more rounds and these will feel easy.':'Every word you saw is now a little more familiar.',
      rows:[['Sun earned',earned+5]],again:wordPlay});
  }
  sBody.onclick=e=>{
    const t=e.target.closest('[data-tile]');if(t){addTile(+t.dataset.tile);return;}
    const s=e.target.closest('[data-slot]');if(s){removeAt(+s.dataset.slot);return;}
    if(e.target.closest('[data-hint]'))hint();
    else if(e.target.closest('[data-clear]'))clearAll();
    else if(e.target.closest('[data-skip]')){sfx.tap();next();}
  };
  listen(document,'keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(/^[a-zA-Z]$/.test(e.key)){
      const ch=S.lang==='ur'?e.key:e.key.toUpperCase(),j=tiles.findIndex(t=>!t.used&&t.ch===ch);
      if(j>=0)addTile(j);
    }else if(e.key==='Backspace'&&ans.length){e.preventDefault();removeAt(ans.length-1);}
  });
  load();
}

/* ---- Pop the Worries ---- */
function popPlay(){
  openStage('pop','Pop the Worries');
  let t=30,pops=0,earned=0;
  sBody.innerHTML='<div class="pophud"><span id="ptime">30s</span><span id="pcount">0 let go</span></div><div class="field" id="field"><div class="field-hint">Tap a worry to let it go</div></div>';
  const f=$('#field',sBody);
  f.style.setProperty('--h',(f.clientHeight+260)+'px');
  function spawn(){
    const size=84+rand(42),w=f.clientWidth||320;
    const b=document.createElement('button');
    b.className='bub';
    b.style.cssText='left:'+Math.max(2,Math.random()*(100-size/w*100))+'%;width:'+size+'px;height:'+size+'px;--dur:'+(5+Math.random()*3)+'s;--c:'+pick(TILE_COLORS);
    b.innerHTML='<span class="bub-in">'+esc(pick(S.lang==='ur'?WORRIES_URDU:WORRIES))+'</span>';
    b.addEventListener('animationend',ev=>{if(ev.target===b)b.remove();});
    f.appendChild(b);
  }
  function popIt(b){
    if(!b||b.dataset.p) return;
    b.dataset.p='1';b.classList.add('popped');
    const c=getComputedStyle(b).getPropertyValue('--c');
    for(let k=0;k<8;k++){const s=document.createElement('i');s.className='sp';s.style.setProperty('--a',(k*45)+'deg');s.style.setProperty('--c',c);b.appendChild(s);}
    setTimeout(()=>b.remove(),450);
    pops++;S.stats.pops++;quest('pop',1);sfx.pop();
    if(earned<40){earned++;award(1,1);floatText(b,'+1');}else{save();}
    $('#pcount',sBody).textContent=pops+' let go';
  }
  listen(f,'pointerdown',e=>popIt(e.target.closest('.bub')));
  listen(f,'click',e=>{if(e.detail===0)popIt(e.target.closest('.bub'));});
  for(let k=0;k<3;k++)later(spawn,k*350);
  every(spawn,520);
  every(()=>{
    t--;$('#ptime',sBody).textContent=t+'s';setProg((30-t)/30);
    if(t<=0)finish();
  },1000);
  function finish(){
    stopActive();
    S.bests.pop=Math.max(S.bests.pop,pops);
    finishGame('pop',{sun:5,xp:10});
    if(pops>=15){confetti(80);sfx.win();}
    active={id:'pop',timers:[],off:[]};
    result({color:'var(--t-bloom)',big:String(pops),label:'worries let go',
      msg:pops>=20?'Deep breath out. The sky looks clearer already.':pops>=8?'Good release. Notice how your shoulders feel.':'Even a few pops count. Unpopped worries drifted off by themselves.',
      rows:[['Sun earned',earned+5]],again:popPlay});
  }
}

/* ---- Slow Breath ---- */
function breathePlay(){
  openStage('breathe','Slow Breath');
  const cycles=5,plan=[['Breathe in',4000,1,440],['Hold',2000,1,0],['Breathe out',6000,.55,330]];
  sBody.innerHTML='<div class="orb-wrap"><div class="orb" id="orb"></div><div class="orb-label" id="olab">Get comfortable</div></div><p class="orb-count" id="ocount"> </p><div class="wbtns"><button class="btn ghost" data-end>End early</button></div>';
  const orb=$('#orb',sBody),lab=$('#olab',sBody),cnt=$('#ocount',sBody);
  let c=0,ph=0;
  sBody.onclick=e=>{if(e.target.closest('[data-end]'))closeStage();};
  function step(){
    if(c>=cycles){finish();return;}
    const p=plan[ph];
    orb.style.transitionDuration=p[1]+'ms';orb.style.transform='scale('+p[2]+')';orb.style.opacity=String(.45+p[2]*.55);
    lab.textContent=p[0];cnt.textContent='Breath '+(c+1)+' of '+cycles;
    if(p[3])tone(p[3],.6,'sine',.03);
    setProg((c*plan.length+ph)/(cycles*plan.length));
    later(()=>{ph++;if(ph>=plan.length){ph=0;c++;}step();},p[1]);
  }
  later(step,900);
  function finish(){
    S.bests.breathe++;S.stats.breaths++;quest('breathe',1);
    finishGame('breathe',{sun:20,xp:20});sfx.win();
    result({color:'var(--t-lav)',big:'5',label:'slow breaths',msg:'Shoulders down, jaw loose. That was one minute you gave back to yourself.',rows:[['Sun earned',20]],again:breathePlay});
  }
}

    if(/موسیقی|آواز|ترتیبات/.test(q))return {text:'میری جگہ کی ترتیبات میں تین مدھم موسیقی کے انداز اور ان کی آواز کی سطح منتخب کریں، یا موسیقی بند رکھیں۔',actions:[go('ترتیبات کھولیں','me')]};
    if(/واٹس ایپ|رابطہ|رائے|تجویز/.test(q))return {text:'اپنی رائے WhatsApp پر بھیجنے کے لیے یہ نجی چیٹ کھولیں؛ پیغام آپ خود بھیجیں گے۔',actions:[{label:'WhatsApp پر رابطہ',url:whatsappUrl('Hi! I have feedback about Mind Bloom.')} ]};
    return {text:'میں مائنڈ بلوم کے کھیل، باغ، مزاج، مشن اور ترتیبات میں مدد کر سکتا ہوں۔ اپنے سوال کو ذرا دوسرے انداز میں پوچھیں یا نیچے سے کوئی جگہ کھولیں۔',actions:[go('کھیل دیکھیں','play'),go('میری پروفائل','me')]};
  }
  if(/\b(hello|hi|hey|good morning|good evening)\b/.test(q))return {text:'Hey'+(S.name?', '+S.name:'')+'! What would make today feel a little easier? I can show you around, find a quick activity, or explain your garden.',actions:[go('Show me around','home'),game('Pick a quick game','quiz')]};
  if(/\b(breathe|breathing|calm|anxious|stress|relax)\b/.test(q))return {text:'For a gentle reset, Slow Breath guides you through five unhurried breaths. Pop the Worries is another quick way to let some tension go.',actions:[game('Start Slow Breath','breathe'),game('Pop the Worries','pop')]};
  if(/\b(garden|plants?|flowers?|grow|growing|water|harvest|seeds?)\b/.test(q))return {text:'Your garden grows with sun. Open Garden, tap an empty plot to plant, then tap the growing plant to water it. A fully bloomed flower can be harvested once a day.',actions:[go('Open Garden','garden')]};
  if(/\b(quiz|brain snacks|learn|question)\b/.test(q))return {text:'Brain Snacks is a short six-question quiz. Pick a topic, answer at your own pace, and each answer comes with an explanation.',actions:[game('Play Brain Snacks','quiz'),go('Browse games','play')]};
  if(/\b(word|vocabulary|unscrambl)\b/.test(q))return {text:'Word Bloom gives you a clue and scrambled letters. Tap letters in order; use Hint if you get stuck, or Clear to start the word again.',actions:[game('Play Word Bloom','word')]};
  if(/\b(memory|pairs|match|focus)\b/.test(q))return {text:'Concept Pairs asks you to match six terms with their meanings. You get one Peek if you want a quick reminder.',actions:[game('Play Concept Pairs','memory')]};
  if(/\b(pop|worr)\b/.test(q))return {text:'Pop the Worries is a 30-second activity. Tap the floating worries to let them drift away; missing one is no problem.',actions:[game('Start Pop the Worries','pop')]};
  if(/\b(mood|feeling|check.?in)\b/.test(q))return {text:'On Home, choose the mood that fits best today. I use it to suggest a matching activity; you can change it later, and the history stays in this browser.',actions:[go('Go to Home','home')]};
  if(/\b(quest|reward|sun|xp|level|streak|badge)\b/.test(q))return {text:'Daily quests give sun when you complete and claim them. Sun plants and waters flowers; XP raises your level. Your streak tracks days you play, and badges mark milestones.',actions:[go('See today’s quests','home'),go('View badges','me')]};
  if(/\b(name|age|profile|private|privacy|data)\b/.test(q))return {text:'You can edit your name and optional age group under Me. No birth date is collected; profile and progress are stored in this browser only.',actions:[go('Open My Profile','me')]};
  if(/\b(music|sound|audio)\b/.test(q))return {text:'Choose a quiet piano, warm pads or breeze texture and set its volume under Me → Settings. Music is optional and starts only after you enable it.',actions:[go('Open sound settings','me')]};
  if(/\b(contact|whatsapp|whats app|wapp|suggestion|feedback)\b/.test(q))return {text:'You can reach the creator on WhatsApp. The link opens a private chat and does not send a message until you choose to send it.',actions:[{label:'Open WhatsApp chat',url:whatsappUrl('Hi! I have a question about Mind Bloom.')} ]};
  return {text:'I’m the friendly Mind Bloom app guide, so I can help with games, your garden, mood check-ins, rewards, and settings. I don’t have a connected AI service for general questions yet, but I can point you to the right part of the app.',actions:[go('Show me the games','play'),go('Open settings','me')]};
}
function guideAsk(text){
  const q=(text||'').trim();if(!q)return;
  guideMessage(q,'user');const answer=guideReply(q);guideMessage(answer.text,'assistant',answer.actions);
}
function toggleGuide(open){
  const panel=$('#guidePanel'),button=$('#guideLaunch');
  panel.hidden=!open;button.setAttribute('aria-expanded',String(open));
  if(open){if(!$('#guideLog').childElementCount){
    const welcome=S.lang==='ur'?'سلام'+(S.name?'، '+S.name:'')+'! میں مائنڈ بلوم کا رہنما ہوں۔ کسی بھی کھیل یا خصوصیت کے بارے میں پوچھیں:':'Hi'+(S.name?', '+S.name:'')+'! I’m your Mind Bloom guide. Ask me how something works, or try one of these:';
    const prompts=S.lang==='ur'?[{label:'باغ میں کیا کر سکتا ہوں؟',ask:'باغ میں کیا کر سکتا ہوں؟'},{label:'مجھے سکون کا وقفہ چاہیے',ask:'مجھے سکون کا وقفہ چاہیے'},{label:'مشن کیسے چلتے ہیں؟',ask:'مشن کیسے چلتے ہیں؟'}]:[{ask:'What can I do in the garden?'},{ask:'I need a calm break'},{ask:'How do the quests work?'}];
    guideMessage(welcome,'assistant',prompts);
  }$('#guideInput').focus();}
}
function applyTheme(){
  const r=document.documentElement;
  if(['light','garden','sunrise','dark'].includes(S.theme))r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme');
}
function welcome(){
  const ageOptions=[['','Choose age group (optional)'],['under18','Under 18'],['18-24','18–24'],['25-34','25–34'],['35-44','35–44'],['45plus','45+']];
  modal('<div class="gift" style="background:var(--t-leaf)">'+ICON.garden+'</div><h2>Welcome to Mind Bloom</h2><p>A small garden that grows while you learn, breathe, and let go of the day. Here are 60 sun to plant your first seed.</p><label class="sr" for="nameWel">Your name</label><input class="field-in" id="nameWel" maxlength="20" placeholder="What should we call you?"><label class="profile-field" for="ageWel">Age group (optional)</label><select class="field-in select" id="ageWel">'+ageOptions.map(o=>'<option value="'+o[0]+'">'+o[1]+'</option>').join('')+'</select><label class="profile-field" for="codeWel">Create a 6-digit resume code</label><input class="field-in" id="codeWel" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="6 digits"><label class="profile-field" for="codeConfirm">Confirm your code</label><input class="field-in" id="codeConfirm" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="Enter it again"><p class="note">Your code unlocks this browser’s saved progress. It does not sync between devices.</p><p class="note" id="resumeError" aria-live="polite"></p><button class="btn big" data-act="welcome">Let\'s grow</button>',false);
}
function setupResumeCode(){
  const ageOptions=[['','Choose age group (optional)'],['under18','Under 18'],['18-24','18–24'],['25-34','25–34'],['35-44','35–44'],['45plus','45+']];
  modal('<div class="gift" style="background:var(--t-leaf)">'+ICON.garden+'</div><h2>Protect your saved garden</h2><p>Your existing level, garden and rewards are still here. Set a resume code to reopen this profile on this browser.</p><label class="profile-field" for="nameWel">Your name</label><input class="field-in" id="nameWel" maxlength="20" value="'+esc(S.name)+'" placeholder="Your name"><label class="profile-field" for="ageWel">Age group (optional)</label><select class="field-in select" id="ageWel">'+ageOptions.map(o=>'<option value="'+o[0]+'"'+(S.ageGroup===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><label class="profile-field" for="codeWel">Create a 6-digit resume code</label><input class="field-in" id="codeWel" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="6 digits"><label class="profile-field" for="codeConfirm">Confirm your code</label><input class="field-in" id="codeConfirm" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" placeholder="Enter it again"><p class="note">The code works only with progress stored in this browser. It is not cloud backup.</p><p class="note" id="resumeError" aria-live="polite"></p><button class="btn big" data-act="saveResumeCode">Save code and continue</button>',false);
}
function resumeProfile(){
  const ageOptions=[['','Choose age group (optional)'],['under18','Under 18'],['18-24','18–24'],['25-34','25–34'],['35-44','35–44'],['45plus','45+']];
  modal('<div class="gift" style="background:var(--t-leaf)">'+ICON.garden+'</div><h2>Continue your garden</h2><p>Your level and progress are saved on this browser. Enter your name and resume code to continue.</p><label class="profile-field" for="nameWel">Your name</label><input class="field-in" id="nameWel" maxlength="20" value="'+esc(S.name)+'" placeholder="Your name"><label class="profile-field" for="ageWel">Age group (optional)</label><select class="field-in select" id="ageWel">'+ageOptions.map(o=>'<option value="'+o[0]+'"'+(S.ageGroup===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select><label class="profile-field" for="codeWel">6-digit resume code</label><input class="field-in" id="codeWel" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="Your code"><p class="note" id="resumeError" aria-live="polite"></p><button class="btn big" data-act="resumeProfile">Continue</button><button class="btn ghost" type="button" data-act="recoverResumeCode">Forgot code? Set a new one</button><p class="note">This code only unlocks saved data on this browser. If browser data is cleared, a code alone cannot restore it.</p>',false);
}
async function saveResumeCode(isNewProfile){
  const name=($('#nameWel')||{}).value.trim(),age=(($('#ageWel')||{}).value)||'',code=normalizeCode(($('#codeWel')||{}).value),confirm=normalizeCode(($('#codeConfirm')||{}).value);
  if(!name){$('#resumeError').textContent='Please enter your name.';return;}
  if(!/^\d{6}$/.test(code)||code!==confirm){$('#resumeError').textContent='Enter the same 6-digit code in both boxes.';return;}
  S.name=name;S.ageGroup=age;S.resumeCodeHash=await hashResumeCode(code);S.onboarded=true;
  if(isNewProfile){S.xp=0;S.sun=60;}
  save();closeModal();renderHome();sfx.good();
}
async function unlockResumeProfile(){
  const name=(($('#nameWel')||{}).value||'').trim(),age=(($('#ageWel')||{}).value)||'',code=normalizeCode(($('#codeWel')||{}).value);
  if(normalizeName(name)!==normalizeName(S.name)||await hashResumeCode(code)!==S.resumeCodeHash){$('#resumeError').textContent='Name or code did not match this saved profile. Try again.';applyLanguage($('#modalBody'));return;}
  if(age)S.ageGroup=age;save();closeModal();renderHome();
}
const normalizeName=name=>String(name||'').trim().toLocaleLowerCase();
function init(){
  if(started) return;started=true;
  $('#sunIc').innerHTML=ICON.sun;
  $('#stageClose').innerHTML=ICON.close;
  $('#guideIcon').innerHTML=ICON.quiz;$('#guideLaunch').innerHTML=ICON.quiz;$('#guideClose').innerHTML=ICON.close;
  $('#guideForm button').innerHTML=I('<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>');
  $('#languageToggle').addEventListener('click',()=>{S.lang=S.lang==='ur'?'en':'ur';save();applyLanguage();render();});
  $('#guideLaunch').addEventListener('click',()=>toggleGuide($('#guidePanel').hidden));
  $('#guideClose').addEventListener('click',()=>toggleGuide(false));
  $('#guideForm').addEventListener('submit',e=>{e.preventDefault();const input=$('#guideInput'),q=input.value;input.value='';guideAsk(q);});
  $('#tabs').innerHTML=[['home','Home'],['play','Play'],['garden','Garden'],['me','Me']].map(t=>'<button class="tab" data-go="'+t[0]+'"><span class="ti">'+ICON[t[0]]+'</span><span>'+t[1]+'</span></button>').join('');
  languageObserver.observe(document.body,{childList:true,subtree:true});
  applyLanguage();applyTheme();fitFx();window.addEventListener('resize',fitFx);
  updateHud();
  document.addEventListener('click',e=>{
    const a=e.target.closest('[data-act],[data-go],[data-plot],[data-guide-question],[data-external-url]');
    if(a&&a.dataset.externalUrl){window.open(a.dataset.externalUrl,'_blank','noopener,noreferrer');return;}
    if(!a||a.closest('#stageBody')) return;
    if(a.dataset.guideQuestion){guideAsk(a.dataset.guideQuestion);return;}
    if(a.dataset.go){sfx.tap();go(a.dataset.go);return;}
    if(a.dataset.plot!==undefined){plotAction(+a.dataset.plot);return;}
    const act=a.dataset.act;
    if(act==='mood'){const t=dstr();S.mood={date:t,id:+a.dataset.v};S.moods[t]=+a.dataset.v;save();sfx.tap();renderHome();}
    else if(act==='moodReset'){S.mood=null;save();renderHome();}
    else if(act==='launch'){sfx.tap();GAMES[a.dataset.g].intro();}
    else if(act==='buddy')buddyReact();
    else if(act==='claim')claimQuest(+a.dataset.i);
    else if(act==='chest')openChest();
    else if(act==='harvest')harvest();
    else if(act==='sound'){S.sound=a.dataset.v==='1';save();renderMe();if(S.sound)sfx.tap();}
    else if(act==='music'){S.music=a.dataset.v==='1';save();if(S.music)startAmbient();else stopAmbient();renderMe();}
    else if(act==='language'){S.lang=a.dataset.v;save();applyLanguage();renderMe();applyLanguage($('#view-me'));}
    else if(act==='theme'){S.theme=a.dataset.v;save();applyTheme();renderMe();}
    else if(act==='changeResumeCode')setupResumeCode();
    else if(act==='recoverResumeCode')setupResumeCode();
    else if(act==='resetAsk'){resetAsk=true;renderMe();}
    else if(act==='resetNo'){resetAsk=false;renderMe();}
    else if(act==='resetYes'){resetAsk=false;S=defaults();save();applyTheme();updateHud();go('home');welcome();}
    else if(act==='modalClose')closeModal();
    else if(act==='welcome')saveResumeCode(true);
    else if(act==='saveResumeCode')saveResumeCode(false);
    else if(act==='resumeProfile')unlockResumeProfile();
  });
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&$('#modal').dataset.dismiss==='1')closeModal();});
  $('#stageClose').addEventListener('click',closeStage);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(!$('#modal').hidden&&$('#modal').dataset.dismiss==='1')closeModal();else if(!stage.hidden)closeStage();}
    if(e.key==='Enter'&&e.target.id==='nameWel'){const b=$('[data-act="welcome"]');if(b)b.click();}
    if(e.key==='Escape'&&!$('#guidePanel').hidden)toggleGuide(false);
  });
  go('home');
  if(!S.onboarded)welcome();
  else if(!S.resumeCodeHash)setupResumeCode();
  else resumeProfile();
  if(S.music)startAmbient();
  const t0=Date.now();let nudged=0;
  setInterval(()=>{
    const m=Math.floor((Date.now()-t0)/60000);
    if(m>=25*(nudged+1)){nudged++;toast('You have been here '+m+' minutes. Stretch, sip some water, rest your eyes. Your garden will wait.','good');}
  },30000);
}
function start(d){
  if(d&&d.state&&typeof d.state==='object')S=Object.assign(defaults(),d.state);
  init();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({state:S}));}catch(e){}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}catch(e){start({});}
})();
</script>

</body></html>
